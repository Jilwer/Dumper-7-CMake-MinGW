name: Build And Upload Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake --preset vs2022

      - name: Build
        run: cmake --build --preset vs2022-Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dumper-7_x64-Release
          path: |
            ./out/build/vs2022/Release/Dumper-7.dll
            ./out/build/vs2022/Release/Dumper-7.pdb
          if-no-files-found: error

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Dumper-7_x64-Release
          path: release-artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            release-artifacts/Dumper-7.dll
            release-artifacts/Dumper-7.pdb
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
